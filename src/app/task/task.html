<h2>Ma liste de tâches</h2>

<h3>Nombre de tâches : {{ count() }}</h3>

<button (click)="addTask()">
  Ajouter une tâche
</button>

<button (click)="clearTasks()">
  Vider la liste
</button>

<hr>

@if (tasks().length > 0) {

  @for (task of tasks(); track task.id) {

    <app-task-card
      [task]="task"
      (completed)="onCompleted($event)"
    />

  }

} @else {

  <p>Aucune tâche disponible.</p>

}
